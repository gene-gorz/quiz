<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siberian English with Gene</title>
<style>
:root{--bg:#f6f4ee;--card:#fffefb;--fg:#1c2421;--mut:#5c6662;--line:#d8d4c8;--brand:#1f5a43;--brand-fg:#fff;--ok:#1b6b43;--bad:#a3281f;--warn:#8a5a00;--okbg:#e3f1e8;--badbg:#f8e4e1;--warnbg:#fbf0d6}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1c2320;--fg:#ecebe5;--mut:#a3aaa6;--line:#33403b;--brand:#58c28b;--brand-fg:#0e1512;--ok:#6fd09f;--bad:#f0877e;--warn:#e3b45a;--okbg:#1d3328;--badbg:#3a2220;--warnbg:#38301a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 Georgia,"Times New Roman",serif}
header{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.8rem 1.1rem;border-bottom:1px solid var(--line);background:var(--card)}
header .brand{font-weight:bold;font-size:1.05rem}
header .who{font:.9rem system-ui,sans-serif;color:var(--mut)}
main{max-width:40rem;margin:0 auto;padding:1.3rem 1.1rem 3rem}
h2{font-size:1.3rem;margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:.9rem}
.sans{font-family:system-ui,sans-serif}
.mut{color:var(--mut);font:.9rem system-ui,sans-serif}
button{font:600 .95rem system-ui,sans-serif;padding:.6rem 1rem;border-radius:7px;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-fg);cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.on{border-color:var(--brand);color:var(--brand)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
input,select{font:1rem system-ui,sans-serif;padding:.55rem .65rem;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);max-width:100%}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.field{display:block;margin-bottom:.8rem}
.field span{display:block;font:.85rem system-ui,sans-serif;color:var(--mut);margin-bottom:.2rem}
.field input{width:100%}
.sentence{font-size:1.2rem;line-height:2.1}
.sentence input{width:9rem;margin:0 .2rem;text-align:center}
.msg{padding:.7rem .9rem;border-radius:8px;margin:.8rem 0;font:.95rem system-ui,sans-serif}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}
.pill{display:inline-block;font:600 .8rem system-ui,sans-serif;padding:.15rem .55rem;border-radius:99px}
.pill.correct{background:var(--okbg);color:var(--ok)}
.pill.partial,.pill.pending{background:var(--warnbg);color:var(--warn)}
.pill.incorrect{background:var(--badbg);color:var(--bad)}
textarea{width:100%;min-height:11rem;font:.85rem/1.45 ui-monospace,Menlo,Consolas,monospace;padding:.6rem;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
pre.code{white-space:pre-wrap;overflow-wrap:anywhere;font:.82rem/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.7rem;max-height:16rem;overflow:auto}
details{margin:.6rem 0}summary{cursor:pointer;font:600 .92rem system-ui,sans-serif}
ul.plain{margin:.4rem 0;padding-left:1.2rem}
table{border-collapse:collapse;width:100%;font:.88rem/1.35 system-ui,sans-serif}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin-bottom:1.1rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}
.kpi b{display:block;font:700 1.5rem system-ui,sans-serif}
.kpi span{font:.8rem system-ui,sans-serif;color:var(--mut)}
.words{font-size:1.1rem;line-height:1.9;margin:.2rem 0 1rem}
.badge{font:.75rem system-ui,sans-serif;border:1px solid var(--line);border-radius:99px;padding:.05rem .5rem;margin-left:.4rem}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"><p class="mut">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== Настройки (публичные значения, их можно хранить в странице) =====
const SUPABASE_URL = "https://fhsjgpzhytkegxyoomuc.supabase.co";
const SUPABASE_KEY = "sb_publishable_2ZZlp-D9SXhv_B1xhuAmDg_-EnPbCGQ";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// Пустые значения (null/false) не должны выводиться как текст "null"
const _replaceChildren = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...nodes) {
  return _replaceChildren.apply(this, nodes.filter(n => n != null && n !== false));
};
let me = null;
let quiz = null;

// ===== Вспомогательные функции =====
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
function mount(...nodes) {
  const a = document.getElementById("app");
  a.replaceChildren(...nodes.filter(Boolean));
  window.scrollTo(0, 0);
}
function note(kind, text) { return el("div", { class: "msg " + kind, role: "status" }, text); }
const SERVER_MSG = {
  "Нужно войти в аккаунт": "Please sign in",
  "Задание недоступно": "This exercise is not available",
  "Попытка не найдена": "Attempt not found",
  "Попытка уже завершена": "This attempt is already finished",
  "Доступно только преподавателю": "Teacher access only",
  "В задании есть вопрос без версии": "The exercise contains a question without a version",
  "В задании нет вопросов": "The exercise has no questions"
};
const SERVER_RX = [
  [/^Вопрос (\d+): нет текущей версии$/, "Question $1: no current version"],
  [/^Вопрос (\d+): не описаны пропуски$/, "Question $1: blanks are not defined"],
  [/^Вопрос (\d+): в тексте (\d+) пропусков, описано (\d+)$/, "Question $1: the text has $2 blanks but $3 are defined"],
  [/^Вопрос (\d+): нет полного правильного ответа$/, "Question $1: no complete correct answer"],
  [/^Вопрос (\d+): не отмечен основной ответ$/, "Question $1: no main answer is marked"],
  [/^Ожидается ответов: (\d+)$/, "Expected answers: $1"]
];
function tr(m) {
  m = String(m);
  if (SERVER_MSG[m]) return SERVER_MSG[m];
  for (const [rx, out] of SERVER_RX) if (rx.test(m)) return m.replace(rx, out);
  return m;
}
function errText(e) { return tr((e && e.message) ? e.message : String(e)); }
function fill(template, answers) {
  return template.replace(/\{(\d+)\}/g, (m, n) => "[" + (answers && answers[n - 1] ? answers[n - 1] : "…") + "]");
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).slice(0, 10) + "T00:00:00");
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
const VERDICT = { correct: "Correct", partial: "Partly correct", incorrect: "Incorrect", pending: "Awaiting teacher review" };

// ===== Вход =====
function showLogin(mode = "signin", message = null) {
  const email = el("input", { type: "email", autocomplete: "email", required: true });
  const pass = el("input", { type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password", required: true, minlength: 6 });
  const name = el("input", { type: "text", autocomplete: "name" });
  const box = el("div");
  if (message) box.append(message);
  const form = el("form", { class: "card" },
    el("h2", null, mode === "signup" ? "Create account" : "Sign in"),
    el("label", { class: "field" }, el("span", null, "Email"), email),
    mode === "signup" ? el("label", { class: "field" }, el("span", null, "Your name"), name) : null,
    el("label", { class: "field" }, el("span", null, mode === "signup" ? "Password (at least 6 characters)" : "Password"), pass),
    box,
    el("div", { class: "row" },
      el("button", { type: "submit" }, mode === "signup" ? "Create account" : "Sign in"),
      el("button", { type: "button", class: "ghost", onclick: () => showLogin(mode === "signup" ? "signin" : "signup") },
        mode === "signup" ? "I already have an account" : "Create account")));
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    box.replaceChildren(note("warn", "Please wait…"));
    try {
      if (mode === "signup") {
        const { data, error } = await sb.auth.signUp({
          email: email.value.trim(), password: pass.value,
          options: { data: { display_name: name.value.trim() || null } }
        });
        if (error) throw error;
        if (!data.session) { showLogin("signin", note("ok", "Account created. Confirm your email address using the message we sent you, then sign in.")); return; }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
        if (error) throw error;
      }
    } catch (e) {
      box.replaceChildren(note("bad", "Something went wrong: " + errText(e)));
    }
  });
  mount(form);
}

// ===== Шапка и вкладки =====
function renderTop() {
  const top = document.getElementById("top");
  top.replaceChildren(
    el("span", { class: "brand" }, "Siberian English with Gene"),
    me ? el("span", { class: "who" }, me.name,
          el("span", { class: "badge" }, me.role === "teacher" ? "teacher" : "student"), " ",
          el("button", { class: "ghost", onclick: () => sb.auth.signOut() }, "Sign out")) : null);
}
function showHome(tab = "tasks") {
  document.getElementById("app").style.maxWidth = tab === "stats" ? "62rem" : "";
  const tabs = [["tasks", "Exercises"], ["due", "Review"]];
  if (me.role === "teacher") tabs.push(["review", "Disputed answers"], ["sets", "Sets"], ["stats", "Statistics"], ["log", "Log"]);
  const body = el("div");
  const nav = el("div", { class: "tabs" }, tabs.map(([id, label]) =>
    el("button", { class: id === tab ? "on ghost" : "ghost", onclick: () => showHome(id) }, label)));
  mount(nav, body);
  if (tab === "tasks") tabTasks(body);
  else if (tab === "due") tabDue(body);
  else if (tab === "review") tabReview(body);
  else if (tab === "sets") tabSets(body);
  else if (tab === "stats") tabStats(body);
  else tabLog(body);
}

// ===== Вкладка: задания =====
async function tabTasks(box) {
  box.append(el("h2", null, "Exercises"));
  const { data, error } = await sb.from("exercises").select("id,title,kind").eq("status", "published").order("created_at");
  if (error) { box.append(note("bad", "Could not load exercises: " + errText(error))); return; }
  if (!data.length) { box.append(note("warn", "No published exercises yet.")); return; }
  data.forEach(x => box.append(el("div", { class: "card row", style: "justify-content:space-between;margin-top:0" },
    el("div", null, el("strong", null, x.title), el("div", { class: "mut" }, x.kind === "grammar" ? "Grammar" : "Vocabulary")),
    el("button", { onclick: () => openExercise(x.id) }, "Open"))));
}


// ===== Стартовая страница задания: список слов =====
async function openExercise(id) {
  mount(el("p", { class: "mut" }, "Loading…"));
  const { data, error } = await sb.rpc("exercise_words", { p_exercise: id });
  if (error) { mount(note("bad", "Could not open the exercise: " + errText(error)), el("button", { onclick: () => showHome("tasks") }, "Back")); return; }
  const words = data.words || [];
  mount(
    el("h2", null, data.title),
    el("div", { class: "card" },
      el("p", { class: "mut" }, (data.kind === "grammar" ? "Grammar" : "Vocabulary") + " · " + data.questions + (data.questions === 1 ? " question" : " questions")),
      words.length ? el("div", null, el("div", { class: "mut" }, "Words and expressions in this exercise"), el("p", { class: "words" }, words.join(" · "))) : null,
      el("div", { class: "row" },
        el("button", { type: "button", onclick: () => startQuiz(id) }, "Start"),
        el("button", { type: "button", class: "ghost", onclick: () => showHome("tasks") }, "Back"))));
}

// ===== Прохождение =====
async function startQuiz(exerciseId) {
  mount(el("p", { class: "mut" }, "Preparing the exercise…"));
  const { data, error } = await sb.rpc("start_attempt", { p_exercise: exerciseId });
  if (error) { mount(note("bad", "Could not start: " + errText(error)), el("button", { onclick: () => showHome("tasks") }, "Back")); return; }
  quiz = { attempt: data.attempt_id, mode: data.show_answers, qs: data.questions, i: 0, back: "tasks" };
  showQuestion();
}
function sentenceNode(template, inputs) {
  const parts = template.split(/\{(\d+)\}/);
  const s = el("div", { class: "sentence" });
  parts.forEach((p, k) => {
    if (k % 2 === 0) s.append(p);
    else {
      const inp = el("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Blank " + p });
      inputs[Number(p) - 1] = inp;
      s.append(inp);
    }
  });
  return s;
}
function showQuestion() {
  const q = quiz.qs[quiz.i];
  const inputs = [];
  const sentence = sentenceNode(q.template, inputs);
  const out = el("div");
  const send = el("button", { type: "button" }, "Submit");
  send.addEventListener("click", async () => {
    const answers = inputs.map(i => i.value.trim());
    if (answers.some(a => !a)) { out.replaceChildren(note("warn", "Please fill in all the blanks.")); return; }
    send.disabled = true; inputs.forEach(i => i.disabled = true);
    out.replaceChildren(note("warn", "Checking…"));
    const { data, error } = await sb.rpc("submit_answer", { p_attempt: quiz.attempt, p_question: q.question_id, p_answers: answers });
    if (error) {
      send.disabled = false; inputs.forEach(i => i.disabled = false);
      out.replaceChildren(note("bad", "Could not submit: " + errText(error)));
      return;
    }
    out.replaceChildren(...feedback(data));
    const last = quiz.i === quiz.qs.length - 1;
    out.append(el("div", { class: "row" }, el("button", { onclick: () => { if (last) finishQuiz(); else { quiz.i++; showQuestion(); } } }, last ? "Finish" : "Next")));
  });
  mount(
    el("p", { class: "mut" }, (quiz.back === "due" ? "Review · question " : "Question ") + (quiz.i + 1) + " of " + quiz.qs.length),
    el("div", { class: "card" }, el("p", { class: "mut" }, "Fill in the blank"), sentence, el("div", { class: "row" }, send)),
    out);
  if (inputs[0]) inputs[0].focus();
}
function feedback(r) {
  const nodes = [];
  if (quiz.mode !== "after_question") { nodes.push(note("warn", "Answer received.")); return nodes; }
  if (r.pending) { nodes.push(note("warn", "Your answer has been sent to your teacher for review.")); }
  else nodes.push(note(r.verdict === "correct" ? "ok" : r.verdict === "partial" ? "warn" : "bad", VERDICT[r.verdict]));
  if (r.expected) nodes.push(el("p", null, "Correct answer: ", el("strong", null, r.expected.join("  /  "))));
  if (r.explanation) nodes.push(el("p", { class: "mut" }, r.explanation));
  if (r.next_review && !r.pending) nodes.push(el("p", { class: "mut" }, "Next review: " + fmtDate(r.next_review)));
  return nodes;
}
async function finishQuiz() {
  mount(el("p", { class: "mut" }, "Calculating your result…"));
  const { data, error } = await sb.rpc("finish_attempt", { p_attempt: quiz.attempt });
  if (error) { mount(note("bad", "Could not finish: " + errText(error)), el("button", { onclick: () => showHome("tasks") }, "Back to exercises")); return; }
  const items = (data.items || []).map(it => el("div", { class: "card" },
    el("div", { class: "sentence", style: "line-height:1.6" }, fill(it.template, it.answers)),
    el("div", { class: "row", style: "margin-top:.4rem" }, el("span", { class: "pill " + it.verdict }, VERDICT[it.verdict] || it.verdict)),
    it.expected ? el("p", null, "Correct answer: ", el("strong", null, it.expected.join("  /  "))) : null,
    it.explanation ? el("p", { class: "mut" }, it.explanation) : null));
  mount(
    el("h2", null, "Result: " + data.score + " out of " + data.total),
    data.pending ? note("warn", "Answers awaiting teacher review: " + data.pending + ". Your result may change.") : null,
    ...items,
    el("div", { class: "row" }, el("button", { onclick: () => showHome(quiz.back || "tasks") }, quiz.back === "due" ? "Back to review" : "Back to exercises")));
}

// ===== Вкладка: к повторению =====
async function tabDue(box) {
  box.append(el("h2", null, "Due for review today"));
  const { data, error } = await sb.rpc("due_expressions");
  if (error) { box.append(note("bad", "Could not load: " + errText(error))); return; }
  if (!data.length) { box.append(note("ok", "All done for today.")); return; }
  box.append(el("div", { class: "row", style: "margin:0 0 1rem" },
    el("button", { type: "button", onclick: startReview }, "Start review (" + data.length + ")")));
  data.forEach(x => box.append(el("div", { class: "card", style: "margin-top:0" },
    el("strong", null, x.phrase), el("div", { class: "mut" }, "Level " + x.level + " of 5 · due: " + fmtDate(x.next_review)))));
}
async function startReview() {
  mount(el("p", { class: "mut" }, "Preparing your review…"));
  const { data, error } = await sb.rpc("start_review");
  if (error) { mount(note("bad", "Could not start: " + errText(error)), el("button", { onclick: () => showHome("due") }, "Back")); return; }
  if (!data.questions.length) {
    mount(note("warn", data.skipped
        ? "There are no published questions yet for the expressions that are due. Please tell your teacher."
        : "Nothing to review today."),
      el("button", { onclick: () => showHome("due") }, "Back"));
    return;
  }
  quiz = { attempt: data.attempt_id, mode: "after_question", qs: data.questions, i: 0, back: "due" };
  showQuestion();
}

// ===== Вкладка: спорные ответы (только преподаватель) =====
async function tabReview(box) {
  box.append(el("h2", null, "Disputed answers"));
  const { data, error } = await sb.from("answer_events")
    .select("id, answers, gap_results, created_at, profiles(display_name), question_versions(template, explanation, answer_variants(is_primary, variant_parts(gap_idx, text_value)))")
    .is("final_verdict", null).order("created_at");
  if (error) { box.append(note("bad", "Could not load: " + errText(error))); return; }
  if (!data.length) { box.append(note("ok", "No disputed answers.")); return; }
  const result = el("div");
  box.append(result);
  data.forEach(ev => box.append(reviewCard(ev, result)));
}
function reviewCard(ev, result) {
  const v = ev.question_versions || {};
  const variants = v.answer_variants || [];
  const main = variants.find(x => x.is_primary) || variants[0];
  const expected = main ? main.variant_parts.slice().sort((a, b) => a.gap_idx - b.gap_idx).map(p => p.text_value) : [];
  const reason = el("select", null,
    ["Acceptable alternative answer", "Typo", "Depends on context", "Error in the answer key", "Other reason"]
      .map(t => el("option", { value: t }, t)));
  const comment = el("input", { type: "text", placeholder: "Comment for the student (optional)", style: "width:100%;margin-top:.5rem" });
  const msg = el("div");
  const card = el("div", { class: "card" });
  async function decide(verdict, btns) {
    btns.forEach(b => b.disabled = true);
    const { data, error } = await sb.rpc("review_answer", {
      p_event: ev.id, p_verdict: verdict, p_reason: reason.value, p_comment: comment.value.trim() || null });
    if (error) { btns.forEach(b => b.disabled = false); msg.replaceChildren(note("bad", "Could not save: " + errText(error))); return; }
    const b = data.repetition_before, a = data.repetition_after;
    let text = "Decision saved: " + VERDICT[verdict] + ".";
    if (a) text += " Review schedule: " + (b ? "level " + b.level + ", " + b.next_review : "new") + " → level " + a.level + ", " + a.next_review + ".";
    card.replaceChildren(note("ok", text));
  }
  const btns = [
    el("button", { type: "button" }, "Accept"),
    el("button", { type: "button", class: "ghost" }, "Partly correct"),
    el("button", { type: "button", class: "ghost" }, "Reject")];
  ["correct", "partial", "incorrect"].forEach((vd, i) => btns[i].addEventListener("click", () => decide(vd, btns)));
  card.append(
    el("div", { class: "mut" }, (ev.profiles && ev.profiles.display_name) || "Student"),
    el("div", { class: "sentence", style: "line-height:1.6;margin:.3rem 0" }, fill(v.template || "", ev.answers)),
    el("div", null, "Student’s answer: ", el("strong", null, (ev.answers || []).join("  /  "))),
    el("div", null, "Expected: ", el("strong", null, expected.join("  /  "))),
    el("div", { class: "mut" }, "Auto-check: " + (ev.gap_results || []).map(g => g.status).join(", ")),
    el("div", { class: "row" }, reason), comment,
    el("div", { class: "row" }, btns), msg);
  return card;
}


// ===== Вкладка: наборы (только преподаватель) =====
const CLAUDE_PROMPT = `Составь набор упражнений на заполнение пропусков и верни ТОЛЬКО JSON в одном блоке кода, без пояснений.
Формат:
{
  "title": "Название набора",
  "kind": "vocabulary",            // или "grammar"
  "show_answers": "after_attempt", // never | after_question | after_attempt
  "shuffle": true,
  "questions": [
    {

function parseSet(text) {
  const t = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  if (!t) throw new Error("The field is empty. Paste the JSON block that Claude returned.");
  if (t[0] !== "{") throw new Error("This is not a JSON set (it must start with “{”). If you pasted a word list, send it to Claude together with the prompt first, then paste Claude’s reply here.");
  try { return JSON.parse(t); } catch (e1) {
    try { return JSON.parse(t.replace(/[“”„]/g, '"').replace(/[‘’]/g, "'")); }
    catch (e2) { throw new Error("Could not read the text. Copy the whole block; quotation marks must be straight (\")."); }
  }
}
function validateSet(o) {
  const errors = [], warnings = [];
  if (!o || typeof o !== "object" || Array.isArray(o)) return { errors: ["Expected an object with the fields title and questions."], warnings };
  if (!String(o.title || "").trim()) errors.push("The set has no title (title).");
  if (o.kind && !["grammar", "vocabulary"].includes(o.kind)) errors.push("kind: must be grammar or vocabulary.");
  if (o.show_answers && !["never", "after_question", "after_attempt"].includes(o.show_answers)) errors.push("show_answers: must be never, after_question or after_attempt.");
  if (!Array.isArray(o.questions) || !o.questions.length) { errors.push("The set has no questions (questions)."); return { errors, warnings }; }
  o.questions.forEach((q, i) => {
    const n = i + 1;
    const tpl = String((q && q.template) || "");
    const slots = [...tpl.matchAll(/\{(\d+)\}/g)].map(m => Number(m[1]));
    const uniq = new Set(slots);
    if (!tpl.trim()) { errors.push("Question " + n + ": no text (template)."); return; }
    if (!slots.length) { errors.push("Question " + n + ": the text has no blanks {1}."); return; }
    if (slots.length !== uniq.size || Math.max(...slots) !== uniq.size) { errors.push("Question " + n + ": blanks must be numbered in order {1}, {2}… with no repeats."); return; }
    const need = uniq.size;
    if (!Array.isArray(q.answers) || !q.answers.length) { errors.push("Question " + n + ": no correct answers (answers)."); return; }
    q.answers.forEach((v, k) => {
      const arr = typeof v === "string" ? [v] : v;
      if (!Array.isArray(arr) || arr.length !== need) errors.push("Question " + n + ": answer variant " + (k + 1) + " must contain exactly " + need + " word(s).");
      else if (arr.some(x => typeof x !== "string" || !x.trim())) errors.push("Question " + n + ": empty answer in variant " + (k + 1) + ".");
    });
    if (!String(q.expression || "").trim()) warnings.push("Question " + n + ": no target expression (expression), so review scheduling will not be tracked for it.");
    if (!String(q.explanation || "").trim()) warnings.push("Question " + n + ": no explanation.");
  });
  return { errors, warnings };
}
function previewSet(o) {
  return o.questions.map((q, i) => {
    const first = Array.isArray(q.answers[0]) ? q.answers[0] : [q.answers[0]];
    return el("li", null, fill(String(q.template), first),
      q.answers.length > 1 ? el("span", { class: "mut" }, "  (+" + (q.answers.length - 1) + " more variant(s))") : null);
  });
}

    case "import": return "Set imported: “" + (a.title || "") + "”, questions: " + (a.questions || "?");
    case "review": return "Decision on a student’s answer: " + (b.verdict ? VERDICT[b.verdict] : "was pending") + " → " + (VERDICT[a.verdict] || a.verdict) + (l.reason ? " (" + l.reason + ")" : "");
    case "edit_question": return "Question edited, version " + a.version_no + ": " + blank(a.template || "");
    case "add_question": return "Question added: " + blank(a.template || "");
    case "restore_version": return "Restored version " + a.version_no + " of the question: " + blank(a.template || "");

async function boot() {
  document.getElementById("app").style.maxWidth = "";
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { me = null; quiz = null; renderTop(); showLogin(); return; }
  const { data: p } = await sb.from("profiles").select("display_name, role").eq("id", session.user.id).single();
  me = { id: session.user.id, name: (p && p.display_name) || session.user.email, role: (p && p.role) || "student" };
  renderTop();
  showHome("tasks");
}
</script>
</body>
